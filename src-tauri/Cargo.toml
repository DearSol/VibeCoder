[package]
name = "expand-studio"
version = "0.1.0"
description = "Expand Studio image editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "expand_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
